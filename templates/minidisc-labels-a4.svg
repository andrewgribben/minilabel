<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="210mm"
  height="297mm"
  viewBox="0 0 210 297"
  version="1.1">
  <title>A4 MiniDisc label cutting template</title>
  <desc>Eight repeated sets, each containing two portrait 36 x 53 mm face labels and two 59 x 4 mm edge labels. Print or cut at 100 percent / actual size.</desc>

  <!--
    A4 page: 210 x 297 mm
    8 sets per sheet
    16 main MiniDisc labels: 36 x 53 mm (portrait)
    16 edge labels: 59 x 4 mm

    The page itself has no drawn background, so only the four red hairline
    paths are present when this file is imported into cutting software.
  -->
  <g
    inkscape:groupmode="layer"
    inkscape:label="CUT PATHS - 100% SCALE"
    id="cut-paths"
    fill="none"
    stroke="#ff0000"
    stroke-width="0.1"
    vector-effect="non-scaling-stroke">
    <!-- Eight compact 74 x 65 mm sets: two columns by four rows. -->
    <g id="label-set-1" transform="translate(29 8)">
      <rect id="face-label-1a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-1b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-1a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-1b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>
    <g id="label-set-2" transform="translate(107 8)">
      <rect id="face-label-2a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-2b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-2a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-2b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>

    <g id="label-set-3" transform="translate(29 80)">
      <rect id="face-label-3a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-3b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-3a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-3b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>
    <g id="label-set-4" transform="translate(107 80)">
      <rect id="face-label-4a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-4b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-4a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-4b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>

    <g id="label-set-5" transform="translate(29 152)">
      <rect id="face-label-5a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-5b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-5a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-5b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>
    <g id="label-set-6" transform="translate(107 152)">
      <rect id="face-label-6a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-6b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-6a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-6b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>

    <g id="label-set-7" transform="translate(29 224)">
      <rect id="face-label-7a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-7b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-7a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-7b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>
    <g id="label-set-8" transform="translate(107 224)">
      <rect id="face-label-8a" x="0" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="face-label-8b" x="38" y="0" width="36" height="53" rx="1" ry="1" />
      <rect id="edge-label-8a" x="7.5" y="55" width="59" height="4" rx="0.75" ry="0.75" />
      <rect id="edge-label-8b" x="7.5" y="61" width="59" height="4" rx="0.75" ry="0.75" />
    </g>
  </g>
</svg>
